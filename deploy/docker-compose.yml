# Note: Root docker-compose.yml is the primary entrypoint (d:\cbt\docker-compose.yml).
# This file is retained for deployment directory compatibility.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cbt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cbt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cbt_secret_password_2026}
      POSTGRES_DB: ${DB_NAME:-cbt_db}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - cbt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cbt_user} -d ${DB_NAME:-cbt_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cbt-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_DSN: "postgres://${DB_USER:-cbt_user}:${DB_PASSWORD:-cbt_secret_password_2026}@postgres:5432/${DB_NAME:-cbt_db}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-cbt-highschool-super-secret-key-2026}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cbt-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  cbt_pgdata:
    driver: local