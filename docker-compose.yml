name: cbt-system

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cbt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-cbt_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cbt_secret_password_2026}
      POSTGRES_DB: ${DB_NAME:-cbt_db}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cbt_user} -d ${DB_NAME:-cbt_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cbt-network

  # ----------------------------------------------------
  # 2. Go Fiber Backend Engine Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cbt-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_DSN: "postgres://${DB_USER:-cbt_user}:${DB_PASSWORD:-cbt_secret_password_2026}@postgres:5432/${DB_NAME:-cbt_db}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-cbt-highschool-super-secret-key-2026}
      TZ: ${TZ:-Asia/Jakarta}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - cbt-network

  # ----------------------------------------------------
  # 3. Frontend Web App & Reverse Proxy (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cbt-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cbt-network

volumes:
  postgres_data:
    name: cbt_postgres_data

networks:
  cbt-network:
    name: cbt_network
    driver: bridge